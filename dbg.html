<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIAGNÓSTICO LA VOZ</title>
<script src="supabase-js.min.js"></script>
<script src="config.js"></script>
<script src="misiones.js"></script>
<style>body{background:#111;color:#eee;font-family:monospace;padding:20px;font-size:15px;line-height:1.7}p{margin:6px 0}.ok{color:#4caf50}.fail{color:#ff5252}.warn{color:#ffb300}</style>
</head>
<body>
<h2>Diagnóstico del panel — LA VOZ</h2>
<div id="out"><p>Iniciando...</p></div>
<script>
function log(t, cls){ var d=document.createElement('p'); if(cls)d.className=cls; d.textContent=t; document.getElementById('out').appendChild(d); }
function conTimeout(p, ms, nombre){
  return Promise.race([
    p.then(function(v){ return {ok:true, v:v}; }, function(e){ return {ok:false, err:e&&e.message}; }),
    new Promise(function(res){ setTimeout(function(){ res({ok:false, timeout:true}); }, ms); })
  ]);
}
(async function(){
  try{
    log('A. scripts cargados');
    log('B. BACKEND_ACTIVO = ' + (typeof BACKEND_ACTIVO!=='undefined' ? BACKEND_ACTIVO : 'INDEFINIDO'), typeof BACKEND_ACTIVO!=='undefined'&&BACKEND_ACTIVO?'ok':'fail');
    log('C. window.supabase = ' + typeof window.supabase, typeof window.supabase!=='undefined'?'ok':'fail');
    if(typeof window.supabase==='undefined'){ log('FIN: supabase-js no cargó', 'fail'); return; }
    var sb = getSupabase();
    log('D. getSupabase OK: ' + !!sb, sb?'ok':'fail');
    if(!sb){ log('FIN: getSupabase devolvió null', 'fail'); return; }
    log('E. llamando getSession (timeout 15s)...');
    var r = await conTimeout(sb.auth.getSession(), 15000, 'getSession');
    if(!r.ok){ log('F. getSession SE CUELGA (timeout 15s) <<<', 'fail'); return; }
    if(r.err){ log('F. getSession THROW: '+r.err, 'fail'); return; }
    var ses = r.v.data && r.v.data.session;
    log('F. getSession respondió. session=' + !!ses, ses?'ok':'warn');
    if(!ses){ log('G. Sin sesión: el panel redirigiría a ingresar.html', 'warn'); return; }
    var uid = ses.user.id;
    log('G. uid = ' + uid);
    log('H. query profiles (timeout 15s)...');
    var q = await conTimeout(sb.from('profiles').select('id,full_name,lvz_number,lvz_code,rank,status').eq('id',uid).single(), 15000, 'profiles');
    if(!q.ok){ log('I. profiles SE CUELGA (timeout 15s) <<<', 'fail'); return; }
    if(q.err){ log('I. profiles THROW: '+q.err, 'fail'); return; }
    log('I. profiles error=' + (q.v.error ? q.v.error.message+' ('+q.v.error.code+')' : 'null'), q.v.error?'fail':'ok');
    log('J. profiles data=' + (q.v.data ? JSON.stringify(q.v.data) : 'null'), q.v.data?'ok':'warn');
    log('K. FIN DEL DIAGNÓSTICO', 'ok');
  }catch(e){ log('THROW NO ATRAPADO: ' + (e&&e.message), 'fail'); }
})();
</script>
</body>
</html>
